name: World map data

on:
  workflow_dispatch:
  push:
    paths: [ "tools/make_world.py" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/make_world.py world.bin
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: world-data
          name: World map data
          files: world.bin
          make_latest: false
