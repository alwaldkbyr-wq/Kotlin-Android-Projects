name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Accept wrapped Base64, or the Base64 section copied from signing-secrets.txt.
          # Stop before any following ANDROID_* secret labels.
          KEY_DATA="$(printf "%s\\n" "$ANDROID_KEYSTORE_BASE64" | awk '
            NR == 1 && /^ANDROID_KEYSTORE_BASE64[=:]/ {
              sub(/^ANDROID_KEYSTORE_BASE64[=:][[:space:]]*/, "")
              print
              next
            }
            /^ANDROID_[A-Z0-9_]+[=:]/ { exit }
            { print }
          ' | tr -d '[:space:]')"
          if [ -z "$KEY_DATA" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty."
            exit 1
          fi
          if ! printf "%s" "$KEY_DATA" | grep -Eq "^[A-Za-z0-9+/]+=*$"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Copy only its value from signing-secrets.txt."
            exit 1
          fi
          mkdir -p app
          printf "%s" "$KEY_DATA" | base64 --decode > app/release-key.jks
          if [ ! -s app/release-key.jks ]; then
            echo "::error::Decoded signing file is empty."
            exit 1
          fi
          keytool -list -keystore app/release-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD"
      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mawaqeet-release-1.0.1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mawaqeet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Trigger a fresh release build after signing-key parsing fix.
