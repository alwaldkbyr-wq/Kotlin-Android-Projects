name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEY_DATA="$(printf "%s" "$ANDROID_KEYSTORE_BASE64" | tr -cd "A-Za-z0-9+/")"
          case $(( ${#KEY_DATA} % 4 )) in
            2) KEY_DATA="${KEY_DATA}==" ;;
            3) KEY_DATA="${KEY_DATA}=" ;;
          esac
          printf "%s" "$KEY_DATA" | base64 --decode > release-key.jks
          keytool -list -keystore release-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mawaqeet-release-1.0.1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mawaqeet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
